services:
  app:
    build:
      context: .
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html/app
      - ./www:/var/www/html/www
      - ./config:/var/www/html/config
      - ./temp:/var/www/html/temp
      - ./log:/var/www/html/log
    environment:
      NETTE_DEBUG: "1"
